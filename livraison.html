<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Africa United - Commandes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="auth-buttons">
            <a href="profil.html">Profil Livreur</a>
        </div>
        <div class="header-title">
            <a href="accueil.html" style="color: white; text-decoration: none;">AFRICA UNITED - LIVREUR</a>
        </div>
        <div class="auth-buttons">
            <a href="index.html" class="login" style="border-color: #ce1126; color: #ce1126;">Déconnexion</a>
        </div>
    </header>

    <main class="delivery-page">
        <div class="delivery-header">
            <h1>Commandes à livrer</h1>

        </div>
        <div class="delivery-container">
             <div class="dashboard-card info-card">
                <div class="form-group">
                    <label>Commande :</label>
                    <div class="input-wrapper">
                        <span class="delivery-text">...</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Téléphone :</label>
                    <div class="input-wrapper">
                        <span class="delivery-text">...</span>
                        <span class="edit-icon" title="Appeler">📞</span>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adresse :</label>
                    <div class="input-wrapper">
                        <ul style="margin: 0; padding-left: 20px; list-style-type: none;">
                            <li><strong>Ville :</strong>...</li>
                            <li><strong>Rue :</strong>...</li>
                            <li><strong>Numéro :</strong>...</li>
                            <li><strong>Etage :</strong>...</li>
                            <li><strong>Interphone :</strong>...</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label>Adresse :</label>
                    <div class="input-wrapper">
                        <ul style="margin: 0; padding-left: 20px; list-style-type: none;">
                            <li><strong>Ville :</strong>...</li>
                            <li><strong>Rue :</strong>...</li>
                            <li><strong>Numéro :</strong>...</li>
                        </ul>
                    </div>
                </div>

                <div class="form-group">
                    <label>Indications spéciales :</label>
                    <div class="input-wrapper">
                        <span class="commande-texte" style="font-style: italic; color: #e67e22;">
                            "..." </span>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 25px;">
                    <a href="https://maps.google.com/?q=Paris" target="_blank" class="btn-submit" style="background-color: #3498db; text-align: center; display: block; text-decoration: none;">
                        📍 Ouvrir dans le GPS
                    </a>
                </div>
    
                <hr style="border: 1px solid #eee; margin: 20px 0;">
    
                <button class="btn-submit" style="background-color: #27ae60; width: 100%; height: 60px; font-size: 1.2rem;">
                    ✅ LIVRAISON TERMINÉE
                </button>
                
             </div>
        </div>
    </main>
</body>
</html>
